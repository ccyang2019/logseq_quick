name: Build Logseq Windows Executable

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  push:
    branches:
      - master # or your custom working branch

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.11.1.1435

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build parser and mldoc
        run: pnpm run build:mldoc

      - name: Compile ClojureScript / Electron release
        run: pnpm run release-electron

      - name: Package Windows Executable with electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm exec electron-builder --win --x64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Logseq-Windows-x64
          path: |
            dist/*.exe
            dist/win-unpacked/
          if-no-files-found: error
